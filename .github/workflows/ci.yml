name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read package manager version
        id: toolchain
        run: echo "pnpm=$(cat .pnpm-version | tr -d '\r\n')" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prepare app environment
        run: |
          cp .env.example .env
          pnpm check:standard

      - run: pnpm lint

      - run: pnpm test:ci

      - run: pnpm build+zip
        env:
          GENERATE_SOURCEMAP: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: lingoflow-chrome-${{ github.sha }}
          path: |
            build/chrome.zip
            build/chrome.zip.sha256
            build/release-report.json
          if-no-files-found: error
          retention-days: 30
