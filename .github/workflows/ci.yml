name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prepare app environment
        run: |
          cp .env.example .env
          pnpm sync-version

      - run: pnpm lint

      - run: pnpm test:ci

      - run: pnpm build+zip
        env:
          GENERATE_SOURCEMAP: "false"

      - run: test -f build/chrome.zip
