<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="'Segoe UI','Microsoft YaHei UI',sans-serif">
  <rect width="1280" height="800" fill="#f6f7f9"/>

  <!-- top label -->
  <text x="72" y="64" font-size="13" letter-spacing="2" fill="#9ca3af">LOGO DIRECTION 01</text>
  <text x="72" y="92" font-size="26" font-weight="700" fill="#111827">双语对照 · 双栏</text>
  <text x="72" y="118" font-size="14" fill="#6b7280">两行并排的源语与译语，化作一个对称又略有错位的抽象「K / L」字标。</text>

  <!-- hero mark -->
  <g>
    <rect x="128" y="180" width="76" height="232" rx="38" fill="#2f5bd9"/>
    <rect x="236" y="226" width="76" height="150" rx="38" fill="#d9482c"/>
  </g>

  <!-- hero wordmark -->
  <text x="178" y="492" font-size="44" font-weight="800" fill="#111827" letter-spacing="1">LingoFlow</text>
  <text x="178" y="530" font-size="18" fill="#6b7280" letter-spacing="6">灵语 · 双语对照</text>

  <!-- divider -->
  <line x1="560" y1="120" x2="560" y2="700" stroke="#e5e7eb" stroke-width="1"/>

  <!-- app icon tile -->
  <text x="640" y="180" font-size="13" letter-spacing="2" fill="#9ca3af">APP ICON · 128PX</text>
  <g>
    <rect x="640" y="204" width="128" height="128" rx="28" fill="#111827"/>
    <rect x="678" y="242" width="24" height="66" rx="12" fill="#5b83f0"/>
    <rect x="710" y="256" width="24" height="42" rx="12" fill="#e4673f"/>
  </g>

  <!-- favicon -->
  <text x="640" y="380" font-size="13" letter-spacing="2" fill="#9ca3af">FAVICON · 32PX</text>
  <g>
    <rect x="640" y="398" width="32" height="32" rx="7" fill="#111827"/>
    <rect x="648" y="408" width="7" height="18" rx="3.5" fill="#8fa8f5"/>
    <rect x="658" y="412" width="7" height="11" rx="3.5" fill="#f0a183"/>
  </g>

  <!-- lockup -->
  <text x="640" y="480" font-size="13" letter-spacing="2" fill="#9ca3af">LOCKUP</text>
  <g>
    <rect x="640" y="500" width="42" height="42" rx="10" fill="#111827"/>
    <rect x="652" y="516" width="8" height="20" rx="4" fill="#8fa8f5"/>
    <rect x="664" y="521" width="8" height="12" rx="4" fill="#f0a183"/>
    <text x="698" y="524" font-size="26" font-weight="800" fill="#111827">LingoFlow</text>
    <text x="700" y="550" font-size="12" fill="#6b7280" letter-spacing="4">灵语</text>
  </g>

  <!-- notes -->
  <g font-size="13" fill="#6b7280">
    <text x="640" y="612" font-weight="600" fill="#111827">识别要点</text>
    <text x="640" y="638">· 两个色块 = 源语 / 译语，天然传递「双语对照」</text>
    <text x="640" y="662">· 一高一低的错位排布，保持 K / L 字形联想</text>
    <text x="640" y="686">· 无描边无连接线，深色 tile 与 favicon 上依然清晰</text>
  </g>
</svg>
