  <text x="640" y="480" font-size="13" letter-spacing="2" fill="#77767f">LOCKUP</text>
  <g>
    <rect x="640" y="500" width="42" height="42" rx="10" fill="#202027" stroke="#2b2b33" stroke-width="1"/>
    <path d="M 652 520 C 657 520 658 514 662 514 C 666 514 666 522 662 522 C 658 522 658 530 662 530 C 665 530 666 528 669 528" fill="none" stroke="#ef9f3d" stroke-width="6" stroke-linecap="round"/>
