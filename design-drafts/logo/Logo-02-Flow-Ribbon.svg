<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="'Segoe UI','Microsoft YaHei UI',sans-serif">
  <rect width="1280" height="800" fill="#141416"/>

  <text x="72" y="64" font-size="13" letter-spacing="2" fill="#77767f">LOGO DIRECTION 02</text>
  <text x="72" y="92" font-size="26" font-weight="700" fill="#f2f1ea">语言流动 · 流式丝带</text>
  <text x="72" y="118" font-size="14" fill="#b0afb7">一条折成「L」的流式丝带，尾端带方向箭头，呼应逐字流出的翻译过程。</text>

  <!-- hero mark -->
  <g>
    <circle cx="176" cy="232" r="20" fill="#ef9f3d"/>
    <path d="M 196 232 C 236 232 250 184 282 184 C 322 184 322 246 282 246 C 244 246 244 300 282 300 C 314 300 320 268 344 268" fill="none" stroke="#ef9f3d" stroke-width="30" stroke-linecap="round"/>
    <path d="M 196 232 C 236 232 250 184 282 184 C 322 184 322 246 282 246 C 244 246 244 300 282 300 C 314 300 320 268 344 268" fill="none" stroke="#39b995" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 14"/>
    <path d="M 330 240 L 358 262 L 330 284 Z" fill="#f2f1ea"/>
  </g>

  <text x="148" y="452" font-size="44" font-weight="800" fill="#f2f1ea" letter-spacing="1">LingoFlow</text>
  <text x="148" y="492" font-size="18" fill="#b0afb7" letter-spacing="6">灵语 · 流动的语言</text>

  <line x1="560" y1="120" x2="560" y2="700" stroke="#2b2b33" stroke-width="1"/>

  <text x="640" y="180" font-size="13" letter-spacing="2" fill="#77767f">APP ICON · 128PX</text>
  <g>
