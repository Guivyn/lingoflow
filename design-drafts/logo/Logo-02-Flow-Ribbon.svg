    <text x="700" y="550" font-size="12" fill="#b0afb7" letter-spacing="4">灵语</text>
  </g>

  <g font-size="13" fill="#b0afb7">
    <text x="640" y="612" font-weight="600" fill="#f2f1ea">识别要点</text>
    <text x="640" y="638">· 丝带形状 = LingoFlow 的首字母 L</text>
    <text x="640" y="662">· 虚线内芯 + 箭头 = 流式输出与方向</text>
    <text x="640" y="686">· 暖炭黑 + 琥珀 / 青绿，避免冷蓝霓虹套路</text>
  </g>
