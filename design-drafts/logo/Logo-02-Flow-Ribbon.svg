    <path d="M 668 268 C 682 268 688 248 700 248 C 714 248 714 270 700 270 C 688 270 688 292 700 292 C 710 292 714 282 724 282" fill="none" stroke="#ef9f3d" stroke-width="16" stroke-linecap="round"/>
    <path d="M 718 276 L 730 288 L 718 300 Z" fill="#f2f1ea"/>
  </g>

  <text x="640" y="380" font-size="13" letter-spacing="2" fill="#77767f">FAVICON · 32PX</text>
  <g>
    <rect x="640" y="398" width="32" height="32" rx="7" fill="#202027" stroke="#2b2b33" stroke-width="1"/>
    <path d="M 650 414 C 656 414 658 406 663 406 C 669 406 669 416 663 416 C 657 416 657 426 663 426 C 668 426 670 422 674 422" fill="none" stroke="#ef9f3d" stroke-width="6" stroke-linecap="round"/>
